name: Build ShareRecycleBin

on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: nuget restore FileSystemWatcher.slnx

      - name: Build Release
        run: msbuild FileSystemWatcher.slnx /p:Configuration=Release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ShareRecycleBin-build
          path: '**/bin/Release/**'
